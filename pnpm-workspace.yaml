# 存在本文件时 pnpm 10+ 要求 packages 非空（CI 会 pnpm install --frozen-lockfile）
packages:
  - "."

# Docus 5.15 依赖 nuxt-og-image ~6.10.3。钉到该范围内最新的 6.10.4。
# 7.x 要求的 Nuxt 范围与 Docus 的 ~6.10.3 不兼容。
# pnpm 11 只从 pnpm-workspace.yaml 读 overrides，不再读 package.json 的 pnpm 字段。
# Workers Builds 默认是 pnpm 9，只认 package.json。package.json 的 packageManager 把它钉到同一版 pnpm 11。
overrides:
  nuxt-og-image: 6.10.4

allowBuilds:
  better-sqlite3: true
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@nuxt/kit@4.6.4'
  - '@nuxt/nitro-server@4.6.4'
  - '@nuxt/schema@4.6.4'
  - '@nuxt/vite-builder@4.6.4'
  - '@nuxt/vite-server@4.6.4'
  - nitropack@2.13.6
  - nuxt@4.6.4
  - unrouting@0.3.2
